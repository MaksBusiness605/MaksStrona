<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 1000" width="1272" height="1000" role="img" aria-label="Wykres ciężaru w kolejnych tygodniach: trzy tygodnie z trenerem, potem trening samodzielny" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="siatka" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#14181D" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1272" height="1000" fill="#EDEFF2"/>
  <rect width="1272" height="1000" fill="url(#siatka)"/>

  <g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="140" y="122" font-size="42" font-weight="700" fill="#14181D">Ciężar na sztandze, tydzień po tygodniu</text>
    <text x="140" y="170" font-size="30" fill="#6B7280">Trzy sesje ze mną, potem trenujesz sam</text>

    <!-- moment, w którym kończą się sesje -->
    <line x1="446" y1="268" x2="446" y2="812" stroke="#14181D" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="10 10"/>
    <text x="470" y="252" font-size="27" font-weight="600" fill="#14181D">od tego miejsca trenujesz sam</text>

    <!-- tygodnie 1–3: sesje ze mną -->
    <rect x="160" y="502" width="62" height="288" fill="#14181D"/>
    <rect x="262" y="473" width="62" height="317" fill="#14181D"/>
    <rect x="364" y="444" width="62" height="346" fill="#14181D"/>

    <!-- tygodnie 4–10: trening samodzielny -->
    <rect x="466" y="416" width="62" height="374" fill="#D2F34C"/>
    <rect x="568" y="401" width="62" height="389" fill="#D2F34C"/>
    <rect x="670" y="387" width="62" height="403" fill="#D2F34C"/>
    <rect x="772" y="368" width="62" height="422" fill="#D2F34C"/>
    <rect x="874" y="358" width="62" height="432" fill="#D2F34C"/>
    <rect x="976" y="344" width="62" height="446" fill="#D2F34C"/>
    <rect x="1078" y="334" width="62" height="456" fill="#D2F34C"/>

    <text x="191" y="478" font-size="32" font-weight="700" fill="#14181D" text-anchor="middle">60 kg</text>
    <text x="1109" y="310" font-size="32" font-weight="700" fill="#14181D" text-anchor="middle">95 kg</text>

    <line x1="140" y1="790" x2="1160" y2="790" stroke="#14181D" stroke-width="3"/>

    <g font-size="26" fill="#6B7280" text-anchor="middle">
      <text x="191" y="836">1</text>
      <text x="293" y="836">2</text>
      <text x="395" y="836">3</text>
      <text x="497" y="836">4</text>
      <text x="599" y="836">5</text>
      <text x="701" y="836">6</text>
      <text x="803" y="836">7</text>
      <text x="905" y="836">8</text>
      <text x="1007" y="836">9</text>
      <text x="1109" y="836">10</text>
    </g>

    <g font-size="27" fill="#6B7280">
      <rect x="140" y="884" width="24" height="24" fill="#14181D"/>
      <text x="178" y="905">Sesje ze mną</text>
      <rect x="420" y="884" width="24" height="24" fill="#D2F34C"/>
      <text x="458" y="905">Trenujesz sam</text>
      <text x="1160" y="905" text-anchor="end">tydzień</text>
    </g>
  </g>
</svg>
