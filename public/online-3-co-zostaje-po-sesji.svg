<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 1000" width="1272" height="1000" role="img" aria-label="Notatka po sesji z trzema rzeczami do poprawy i dwa nagrania kluczowych ćwiczeń" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="siatka" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#14181D" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1272" height="1000" fill="#EDEFF2"/>
  <rect width="1272" height="1000" fill="url(#siatka)"/>

  <g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="140" y="122" font-size="42" font-weight="700" fill="#14181D">Co dostajesz tego samego dnia</text>
    <text x="140" y="170" font-size="30" fill="#6B7280">Trzy rzeczy do poprawy na piśmie i nagrania Twoich serii</text>

    <!-- notatka -->
    <rect x="140" y="230" width="600" height="480" fill="#FFFFFF"/>
    <rect x="140" y="230" width="600" height="480" fill="none" stroke="#14181D" stroke-opacity="0.12" stroke-width="2"/>

    <rect x="180" y="266" width="20" height="20" fill="#D2F34C"/>
    <text x="214" y="284" font-size="25" fill="#6B7280">Notatka po sesji · wysłana 19:42</text>
    <line x1="140" y1="312" x2="740" y2="312" stroke="#14181D" stroke-opacity="0.18" stroke-width="2"/>

    <g font-size="27" fill="#14181D">
      <rect x="180" y="352" width="34" height="34" fill="#D2F34C"/>
      <text x="197" y="376" font-size="22" font-weight="700" text-anchor="middle">1</text>
      <text x="238" y="376">Biodra startują za wcześnie</text>

      <rect x="180" y="432" width="34" height="34" fill="#D2F34C"/>
      <text x="197" y="456" font-size="22" font-weight="700" text-anchor="middle">2</text>
      <text x="238" y="456">Kolano ucieka w ósmym powtórzeniu</text>

      <rect x="180" y="512" width="34" height="34" fill="#D2F34C"/>
      <text x="197" y="536" font-size="22" font-weight="700" text-anchor="middle">3</text>
      <text x="238" y="536">Oddech nabrany przed zejściem w dół</text>
    </g>

    <line x1="140" y1="600" x2="740" y2="600" stroke="#14181D" stroke-opacity="0.18" stroke-width="2"/>
    <text x="180" y="646" font-size="25" fill="#6B7280">Zostaje u Ciebie na stałe, razem z nagraniami</text>
    <text x="180" y="684" font-size="25" fill="#6B7280">Wracasz do niej za tydzień i za miesiąc</text>

    <!-- nagrania -->
    <rect x="790" y="230" width="342" height="180" fill="#14181D"/>
    <path d="M941 296l48 24-48 24z" fill="#D2F34C"/>
    <text x="790" y="446" font-size="25" fill="#6B7280">Przysiad, seria 3 · 0:42</text>

    <rect x="790" y="482" width="342" height="180" fill="#14181D"/>
    <path d="M941 548l48 24-48 24z" fill="#D2F34C"/>
    <text x="790" y="698" font-size="25" fill="#6B7280">Martwy ciąg, seria 2 · 0:31</text>

    <line x1="140" y1="760" x2="1132" y2="760" stroke="#14181D" stroke-opacity="0.18" stroke-width="2"/>

    <g font-size="29" fill="#14181D">
      <rect x="148" y="812" width="22" height="22" fill="#D2F34C"/>
      <text x="196" y="832">Następny trening robisz sam, bez zgadywania</text>

      <rect x="148" y="884" width="22" height="22" fill="#D2F34C"/>
      <text x="196" y="904">Płacisz za godzinę, zostaje warsztat na dłużej</text>
