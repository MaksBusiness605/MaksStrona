<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 1000" width="1272" height="1000" role="img" aria-label="Dwie osie czasu: nagranie wysłane po treningu daje odpowiedź po siedmiu dniach, sesja na żywo daje korektę po czterdziestu sekundach" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="siatka" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#14181D" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1272" height="1000" fill="#EDEFF2"/>
  <rect width="1272" height="1000" fill="url(#siatka)"/>

  <g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="140" y="122" font-size="42" font-weight="700" fill="#14181D">Ten sam błąd, dwie drogi do korekty</text>
    <text x="140" y="170" font-size="30" fill="#6B7280">Różnica wynosi siedem dni</text>

    <!-- ══════ OŚ 1: nagranie wysłane po treningu ══════ -->
    <rect x="140" y="238" width="22" height="22" fill="none" stroke="#6B7280" stroke-width="3"/>
    <text x="176" y="257" font-size="25" font-weight="700" fill="#6B7280">Nagranie wysłane po treningu</text>

    <path d="M220 344V326H1060V344" fill="none" stroke="#6B7280" stroke-opacity="0.5" stroke-width="3"/>
    <text x="640" y="310" font-size="27" font-weight="700" fill="#6B7280" text-anchor="middle">7 dni czekania</text>

    <line x1="180" y1="400" x2="1100" y2="400" stroke="#6B7280" stroke-opacity="0.45" stroke-width="4" stroke-dasharray="10 10"/>
    <g fill="#EDEFF2" stroke="#6B7280" stroke-width="4">
      <circle cx="220" cy="400" r="13"/>
      <circle cx="640" cy="400" r="13"/>
      <circle cx="1060" cy="400" r="13"/>
    </g>

    <g font-size="23" fill="#6B7280">
      <text x="180" y="372">poniedziałek</text>
      <text x="640" y="372" text-anchor="middle">wtorek do czwartku</text>
      <text x="1100" y="372" text-anchor="end">piątek</text>
    </g>
    <g font-size="25" fill="#14181D" fill-opacity="0.75">
      <text x="180" y="446">trening i nagranie</text>
      <text x="640" y="446" text-anchor="middle">trzy treningi z tym błędem</text>
      <text x="1100" y="446" text-anchor="end">odpowiedź</text>
    </g>

    <!-- ══════ OŚ 2: sesja na żywo ══════ -->
    <rect x="140" y="556" width="992" height="300" fill="#D2F34C" fill-opacity="0.2"/>

    <rect x="172" y="592" width="22" height="22" fill="#D2F34C"/>
    <text x="208" y="611" font-size="25" font-weight="700" fill="#14181D">Sesja na żywo przez kamerę</text>

    <path d="M252 700V682H640V700" fill="none" stroke="#14181D" stroke-width="3"/>
    <text x="446" y="666" font-size="27" font-weight="700" fill="#14181D" text-anchor="middle">40 sekund do korekty</text>

    <line x1="212" y1="756" x2="1100" y2="756" stroke="#14181D" stroke-width="5"/>
    <g fill="#D2F34C" stroke="#14181D" stroke-width="4">
      <rect x="239" y="743" width="26" height="26"/>
      <rect x="627" y="743" width="26" height="26"/>
      <rect x="1047" y="743" width="26" height="26"/>
    </g>

    <g font-size="23" font-weight="700" fill="#14181D" fill-opacity="0.65">
      <text x="212" y="728">0:00</text>
      <text x="640" y="728" text-anchor="middle">0:40</text>
      <text x="1100" y="728" text-anchor="end">koniec serii</text>
    </g>
    <g font-size="25" fill="#14181D">
      <text x="212" y="806">robisz serie</text>
      <text x="640" y="806" text-anchor="middle">mówię w trakcie serii</text>
      <text x="1100" y="806" text-anchor="end">sprawdzam, czy zostało</text>
    </g>

    <text x="140" y="920" font-size="27" fill="#6B7280">Sztanga jest jeszcze w rękach, kiedy wiesz, co poprawić</text>
  </g>
</svg>
