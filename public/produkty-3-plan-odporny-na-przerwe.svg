<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 1000" width="1272" height="1000" role="img" aria-label="Zamienniki, wersja skrócona i protokół powrotu: po przerwie wracasz do punktu sprzed niej" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="siatka" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#14181D" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1272" height="1000" fill="#EDEFF2"/>
  <rect width="1272" height="1000" fill="url(#siatka)"/>

  <g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="140" y="122" font-size="42" font-weight="700" fill="#14181D">Tydzień, który się nie udał, ma swój scenariusz</text>
    <text x="140" y="170" font-size="30" fill="#6B7280">Choroba i wyjazd nie kasują cyklu</text>

    <!-- trzy mechanizmy -->
    <g>
      <rect x="140" y="236" width="314" height="266" fill="#FFFFFF"/>
      <rect x="140" y="236" width="314" height="266" fill="none" stroke="#14181D" stroke-opacity="0.12" stroke-width="2"/>
      <rect x="168" y="264" width="40" height="40" fill="#D2F34C"/>
      <text x="188" y="292" font-size="24" font-weight="700" fill="#14181D" text-anchor="middle">1</text>
      <text x="168" y="360" font-size="29" font-weight="700" fill="#14181D">Dwa zamienniki</text>
      <g font-size="24" fill="#6B7280">
        <text x="168" y="406">Do każdego ćwiczenia:</text>
        <text x="168" y="440">inny sprzęt, mniejsza</text>
        <text x="168" y="474">ruchomość w stawie</text>
      </g>
    </g>

    <g>
      <rect x="479" y="236" width="314" height="266" fill="#FFFFFF"/>
      <rect x="479" y="236" width="314" height="266" fill="none" stroke="#14181D" stroke-opacity="0.12" stroke-width="2"/>
      <rect x="507" y="264" width="40" height="40" fill="#D2F34C"/>
      <text x="527" y="292" font-size="24" font-weight="700" fill="#14181D" text-anchor="middle">2</text>
      <text x="507" y="360" font-size="29" font-weight="700" fill="#14181D">Wersja 25 minut</text>
      <g font-size="24" fill="#6B7280">
        <text x="507" y="406">Do każdego treningu,</text>
        <text x="507" y="440">na dzień, w którym</text>
        <text x="507" y="474">wszystko się sypie</text>
      </g>
    </g>

    <g>
      <rect x="818" y="236" width="314" height="266" fill="#FFFFFF"/>
      <rect x="818" y="236" width="314" height="266" fill="none" stroke="#14181D" stroke-opacity="0.12" stroke-width="2"/>
      <rect x="846" y="264" width="40" height="40" fill="#D2F34C"/>
      <text x="866" y="292" font-size="24" font-weight="700" fill="#14181D" text-anchor="middle">3</text>
      <text x="846" y="360" font-size="29" font-weight="700" fill="#14181D">Protokół powrotu</text>
      <g font-size="24" fill="#6B7280">
        <text x="846" y="406">Po trzech opuszczonych</text>
        <text x="846" y="440">treningach wracasz do</text>
        <text x="846" y="474">punktu sprzed przerwy</text>
      </g>
    </g>

    <!-- osiem tygodni z przerwą w środku -->
    <text x="536" y="606" font-size="25" fill="#6B7280" text-anchor="middle">przerwa: choroba, wyjazd</text>

    <g fill="#14181D">
      <rect x="148" y="626" width="76" height="76"/>
      <rect x="248" y="626" width="76" height="76"/>
      <rect x="348" y="626" width="76" height="76"/>
    </g>
    <g fill="none" stroke="#14181D" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="8 8">
      <rect x="448" y="626" width="76" height="76"/>
      <rect x="548" y="626" width="76" height="76"/>
    </g>
    <g fill="#D2F34C">
      <rect x="648" y="626" width="76" height="76"/>
      <rect x="748" y="626" width="76" height="76"/>
      <rect x="848" y="626" width="76" height="76"/>
    </g>

    <line x1="648" y1="730" x2="924" y2="730" stroke="#D2F34C" stroke-width="6"/>
    <text x="786" y="774" font-size="28" font-weight="700" fill="#14181D" text-anchor="middle">wracasz tutaj</text>

    <path d="M386 730v34h300" fill="none" stroke="#14181D" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="148" y="850" font-size="26" fill="#6B7280">a nie do poniedziałku i do początku cyklu</text>

    <g font-size="29" fill="#14181D">
      <rect x="148" y="906" width="22" height="22" fill="#D2F34C"/>
      <text x="196" y="926">Plan, który przeżyje zwykły miesiąc, a nie idealny</text>
    </g>
  </g>
</svg>
