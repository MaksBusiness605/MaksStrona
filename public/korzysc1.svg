<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 1000" width="1272" height="1000" role="img" aria-label="Seria dziesięciu powtórzeń przerwana w ósmym, w którym psuje się technika" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="siatka" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#14181D" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1272" height="1000" fill="#EDEFF2"/>
  <rect width="1272" height="1000" fill="url(#siatka)"/>

  <g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="140" y="122" font-size="42" font-weight="700" fill="#14181D">Powtórzenie, w którym technika się sypie</text>
    <text x="140" y="170" font-size="30" fill="#6B7280">Widzę je z boku i przerywam serię, zanim zrobi się nawykiem</text>

    <!-- wskazanie ósmego powtórzenia -->
    <text x="886" y="268" font-size="26" fill="#6B7280" text-anchor="middle">zmęczenie, kolano ucieka</text>
    <text x="886" y="306" font-size="30" font-weight="700" fill="#14181D" text-anchor="middle">tu przerywam serię</text>
    <line x1="886" y1="322" x2="886" y2="344" stroke="#14181D" stroke-width="3"/>

    <!-- powtórzenia 1–7: technika czysta -->
    <g fill="#14181D">
      <rect x="148" y="360" width="76" height="76"/>
      <rect x="248" y="360" width="76" height="76"/>
      <rect x="348" y="360" width="76" height="76"/>
      <rect x="448" y="360" width="76" height="76"/>
      <rect x="548" y="360" width="76" height="76"/>
      <rect x="648" y="360" width="76" height="76"/>
      <rect x="748" y="360" width="76" height="76"/>
    </g>

    <!-- powtórzenie 8: moment korekty -->
    <rect x="848" y="360" width="76" height="76" fill="#D2F34C"/>
    <rect x="836" y="348" width="100" height="100" fill="none" stroke="#14181D" stroke-width="3"/>

    <!-- powtórzenia 9–10: nie dochodzą do skutku -->
    <g fill="none" stroke="#14181D" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="8 8">
      <rect x="948" y="360" width="76" height="76"/>
      <rect x="1048" y="360" width="76" height="76"/>
    </g>

    <g font-size="26" fill="#6B7280" text-anchor="middle">
      <text x="186" y="486">1</text>
      <text x="286" y="486">2</text>
      <text x="386" y="486">3</text>
      <text x="486" y="486">4</text>
      <text x="586" y="486">5</text>
      <text x="686" y="486">6</text>
      <text x="786" y="486">7</text>
      <text x="886" y="486" font-weight="700" fill="#14181D">8</text>
      <text x="986" y="486">9</text>
      <text x="1086" y="486">10</text>
    </g>

    <line x1="140" y1="572" x2="1132" y2="572" stroke="#14181D" stroke-opacity="0.18" stroke-width="2"/>

    <g font-size="30" fill="#14181D">
      <rect x="148" y="622" width="22" height="22" fill="#D2F34C"/>
      <text x="196" y="642">Poprawka w tej samej serii, na sali</text>

      <rect x="148" y="702" width="22" height="22" fill="#D2F34C"/>
      <text x="196" y="722">Ustawienie sprawdzone dłonią, nie okiem</text>

      <rect x="148" y="782" width="22" height="22" fill="none" stroke="#14181D" stroke-opacity="0.35" stroke-width="3"/>
      <text x="196" y="802" fill="#6B7280">Nagranie z telefonu: jeden kąt, jedno powtórzenie</text>
    </g>

    <text x="140" y="900" font-size="27" fill="#6B7280">Asekuracja: wchodzisz na ciężar, na który sam nie wszedłbyś</text>
  </g>
</svg>
