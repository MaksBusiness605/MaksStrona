<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 1000" width="1272" height="1000" role="img" aria-label="Ankieta wejściowa: dni, długość sesji, sprzęt, kontuzje i pytanie o moment, w którym wcześniej odpadasz" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="siatka" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#14181D" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1272" height="1000" fill="#EDEFF2"/>
  <rect width="1272" height="1000" fill="url(#siatka)"/>

  <g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="140" y="122" font-size="42" font-weight="700" fill="#14181D">Ankieta, od której zaczyna się plan</text>
    <text x="140" y="170" font-size="30" fill="#6B7280">Twój tydzień i Twoje ograniczenia, nie modelowy schemat</text>

    <rect x="140" y="230" width="992" height="540" fill="#FFFFFF"/>
    <rect x="140" y="230" width="992" height="540" fill="none" stroke="#14181D" stroke-opacity="0.12" stroke-width="2"/>

    <g font-size="26">
      <text x="180" y="300" fill="#6B7280">Dni w tygodniu</text>
      <text x="560" y="300" fill="#14181D" font-size="28">3</text>

      <text x="180" y="372" fill="#6B7280">Długość sesji</text>
      <text x="560" y="372" fill="#14181D" font-size="28">45 minut</text>

      <text x="180" y="444" fill="#6B7280">Sprzęt</text>
      <text x="560" y="444" fill="#14181D" font-size="28">sztanga, hantle, guma</text>

      <text x="180" y="516" fill="#6B7280">Kontuzje i ograniczenia</text>
      <text x="560" y="516" fill="#14181D" font-size="28">bark prawy, siedząca praca</text>
    </g>

    <g stroke="#14181D" stroke-opacity="0.1" stroke-width="2">
      <line x1="140" y1="326" x2="1132" y2="326"/>
      <line x1="140" y1="398" x2="1132" y2="398"/>
      <line x1="140" y1="470" x2="1132" y2="470"/>
      <line x1="140" y1="542" x2="1132" y2="542"/>
    </g>

    <!-- pytanie, na którym najwięcej zależy -->
    <rect x="172" y="574" width="928" height="158" fill="#D2F34C"/>
    <text x="204" y="626" font-size="29" font-weight="700" fill="#14181D">W którym momencie wcześniej odpadasz?</text>
    <text x="204" y="676" font-size="26" fill="#14181D" fill-opacity="0.75">po trzecim tygodniu, kiedy plan przestaje pasować do grafiku</text>
    <rect x="204" y="696" width="300" height="4" fill="#14181D" fill-opacity="0.35"/>

    <g font-size="29" fill="#14181D">
      <rect x="148" y="822" width="22" height="22" fill="#D2F34C"/>
      <text x="196" y="842">Do planu dostajesz nagranie: dlaczego wygląda właśnie tak</text>

      <rect x="148" y="894" width="22" height="22" fill="none" stroke="#14181D" stroke-opacity="0.35" stroke-width="3"/>
      <text x="196" y="914" fill="#6B7280">Zamiast formularza z imieniem i adresem e-mail</text>
    </g>
  </g>
</svg>
