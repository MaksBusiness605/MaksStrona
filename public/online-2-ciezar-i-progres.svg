<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 1000" width="1272" height="1000" role="img" aria-label="Zasada progresji: jeśli wszystkie serie idą czysto, dokładasz 2,5 kg, jeśli nie, powtarzasz tydzień" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="siatka" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#14181D" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1272" height="1000" fill="#EDEFF2"/>
  <rect width="1272" height="1000" fill="url(#siatka)"/>

  <g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="140" y="122" font-size="42" font-weight="700" fill="#14181D">Kryterium zamiast przeczucia</text>
    <text x="140" y="170" font-size="30" fill="#6B7280">Zasada, kiedy dokładasz, a kiedy zostajesz przy tym samym</text>

    <!-- warunek -->
    <rect x="236" y="250" width="800" height="130" fill="#FFFFFF"/>
    <rect x="236" y="250" width="800" height="130" fill="none" stroke="#14181D" stroke-opacity="0.12" stroke-width="2"/>
    <text x="636" y="306" font-size="32" font-weight="700" fill="#14181D" text-anchor="middle">Wszystkie trzy serie po 8 powtórzeń czysto?</text>
    <text x="636" y="348" font-size="25" fill="#6B7280" text-anchor="middle">sprawdzasz to na ostatniej serii treningu</text>

    <!-- rozgałęzienie -->
    <path d="M636 380v52M400 432h472M400 432v42M872 432v42" fill="none" stroke="#14181D" stroke-opacity="0.35" stroke-width="3"/>

    <!-- tak -->
    <rect x="200" y="474" width="400" height="196" fill="#D2F34C"/>
    <text x="400" y="524" font-size="25" font-weight="700" fill="#14181D" fill-opacity="0.7" text-anchor="middle">Tak, nic się nie sypało</text>
    <text x="400" y="596" font-size="44" font-weight="700" fill="#14181D" text-anchor="middle">+2,5 kg</text>
    <text x="400" y="640" font-size="25" fill="#14181D" fill-opacity="0.7" text-anchor="middle">w kolejnym tygodniu</text>

    <!-- nie -->
    <rect x="672" y="474" width="400" height="196" fill="#FFFFFF"/>
    <rect x="672" y="474" width="400" height="196" fill="none" stroke="#14181D" stroke-opacity="0.12" stroke-width="2"/>
    <text x="872" y="524" font-size="25" font-weight="700" fill="#6B7280" text-anchor="middle">Nie, ostatnia seria siadła</text>
    <text x="872" y="596" font-size="40" font-weight="700" fill="#14181D" text-anchor="middle">ten sam ciężar</text>
    <text x="872" y="640" font-size="25" fill="#6B7280" text-anchor="middle">powtarzasz tydzień</text>

    <line x1="140" y1="742" x2="1132" y2="742" stroke="#14181D" stroke-opacity="0.18" stroke-width="2"/>

    <g font-size="29" fill="#14181D">
      <rect x="148" y="790" width="22" height="22" fill="#D2F34C"/>
      <text x="196" y="810">Ciężary ustawione pod Twój dzisiejszy poziom</text>

      <rect x="148" y="862" width="22" height="22" fill="#D2F34C"/>
      <text x="196" y="882">Progres sprawdzasz, zamiast w niego wierzyć</text>

      <rect x="148" y="934" width="22" height="22" fill="none" stroke="#14181D" stroke-opacity="0.35" stroke-width="3"/>
      <text x="196" y="954" fill="#6B7280">Nie liczby przepisane z cudzego planu</text>
    </g>
  </g>
</svg>
