<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 1000" width="1272" height="1000" role="img" aria-label="Arkusz progresji: obciążenia z pięciu tygodni i kolumna z decyzją o dołożeniu ciężaru" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="siatka" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#14181D" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1272" height="1000" fill="#EDEFF2"/>
  <rect width="1272" height="1000" fill="url(#siatka)"/>

  <g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="140" y="122" font-size="42" font-weight="700" fill="#14181D">Arkusz z zapisanym kryterium</text>
    <text x="140" y="170" font-size="30" fill="#6B7280">Każdy tydzień ma zasadę: kiedy dołożyć, a kiedy zostać</text>

    <!-- tabela -->
    <rect x="140" y="236" width="992" height="376" fill="#FFFFFF"/>
    <rect x="830" y="288" width="302" height="324" fill="#D2F34C" fill-opacity="0.22"/>

    <rect x="140" y="236" width="992" height="52" fill="#14181D"/>
    <g font-size="24" fill="#FFFFFF">
      <text x="164" y="270">Tydzień</text>
      <text x="314" y="270">Przysiad</text>
      <text x="494" y="270">Martwy ciąg</text>
      <text x="674" y="270">Wyciskanie</text>
      <text x="854" y="270" fill="#D2F34C">Decyzja na kolejny tydzień</text>
    </g>

    <g font-size="26" fill="#14181D">
      <text x="164" y="328">1</text><text x="314" y="328">60 kg × 5</text><text x="494" y="328">90 kg × 5</text><text x="674" y="328">45 kg × 5</text><text x="854" y="328" fill="#6B7280">punkt startu</text>
      <text x="164" y="392">2</text><text x="314" y="392">62,5 kg × 5</text><text x="494" y="392">92,5 kg × 5</text><text x="674" y="392">47,5 kg × 5</text><text x="854" y="392" font-weight="700">+2,5 kg</text>
      <text x="164" y="456">3</text><text x="314" y="456">65 kg × 5</text><text x="494" y="456">95 kg × 5</text><text x="674" y="456">50 kg × 5</text><text x="854" y="456" font-weight="700">+2,5 kg</text>
      <text x="164" y="520">4</text><text x="314" y="520">65 kg × 5</text><text x="494" y="520">95 kg × 4</text><text x="674" y="520">50 kg × 5</text><text x="854" y="520" fill="#6B7280">bez zmian</text>
      <text x="164" y="584">5</text><text x="314" y="584">67,5 kg × 5</text><text x="494" y="584">100 kg × 5</text><text x="674" y="584">52,5 kg × 5</text><text x="854" y="584" font-weight="700">+2,5 kg</text>
    </g>

    <g stroke="#14181D" stroke-opacity="0.1" stroke-width="2">
      <line x1="140" y1="352" x2="1132" y2="352"/>
      <line x1="140" y1="416" x2="1132" y2="416"/>
      <line x1="140" y1="480" x2="1132" y2="480"/>
      <line x1="140" y1="544" x2="1132" y2="544"/>
      <line x1="290" y1="288" x2="290" y2="612"/>
      <line x1="470" y1="288" x2="470" y2="612"/>
      <line x1="650" y1="288" x2="650" y2="612"/>
      <line x1="830" y1="288" x2="830" y2="612"/>
    </g>
    <rect x="140" y="236" width="992" height="376" fill="none" stroke="#14181D" stroke-opacity="0.12" stroke-width="2"/>

    <!-- zasada wypisana wprost -->
    <rect x="140" y="656" width="992" height="128" fill="#D2F34C"/>
    <text x="180" y="708" font-size="30" font-weight="700" fill="#14181D">Dokładasz dopiero wtedy, gdy wszystkie serie idą czysto</text>
    <text x="180" y="752" font-size="26" fill="#14181D" fill-opacity="0.75">Czwarty tydzień siadł na martwym ciągu, więc ciężar został ten sam</text>

    <g font-size="29" fill="#14181D">
      <rect x="148" y="844" width="22" height="22" fill="#D2F34C"/>
      <text x="196" y="864">Obciążenia z kilku tygodni w jednym pliku</text>

      <rect x="148" y="916" width="22" height="22" fill="#D2F34C"/>
      <text x="196" y="936">Progres sprawdzasz, zamiast w niego wierzyć</text>
    </g>
  </g>
</svg>
