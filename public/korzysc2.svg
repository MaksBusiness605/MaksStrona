<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 1000" width="1272" height="1000" role="img" aria-label="Karta obciążeń: pięć sesji przysiadu z rosnącym ciężarem i notatką do poprawy" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="siatka" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#14181D" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1272" height="1000" fill="#EDEFF2"/>
  <rect width="1272" height="1000" fill="url(#siatka)"/>

  <g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="140" y="122" font-size="42" font-weight="700" fill="#14181D">Karta obciążeń, sesja po sesji</text>
    <text x="140" y="170" font-size="30" fill="#6B7280">Osiem tygodni zapisu zamiast wrażenia z lustra</text>

    <!-- karta -->
    <rect x="140" y="228" width="992" height="600" fill="#FFFFFF"/>
    <rect x="140" y="228" width="992" height="600" fill="none" stroke="#14181D" stroke-opacity="0.12" stroke-width="2"/>

    <!-- nagłówek tabeli -->
    <g font-size="25" fill="#6B7280">
      <text x="180" y="284">Data</text>
      <text x="360" y="284">Ćwiczenie</text>
      <text x="680" y="284">Ciężar × powtórzenia</text>
      <text x="1000" y="284" text-anchor="middle">Zmiana</text>
    </g>
    <line x1="140" y1="304" x2="1132" y2="304" stroke="#14181D" stroke-opacity="0.18" stroke-width="2"/>

    <!-- wiersze -->
    <g font-size="30" fill="#14181D">
      <text x="180" y="365">03.03</text>
      <text x="360" y="365">Przysiad</text>
      <text x="680" y="365">60 kg × 5</text>

      <text x="180" y="443">10.03</text>
      <text x="360" y="443">Przysiad</text>
      <text x="680" y="443">65 kg × 5</text>

      <text x="180" y="521">17.03</text>
      <text x="360" y="521">Przysiad</text>
      <text x="680" y="521">70 kg × 5</text>

      <text x="180" y="599">24.03</text>
      <text x="360" y="599">Przysiad</text>
      <text x="680" y="599">70 kg × 6</text>

      <text x="180" y="677">31.03</text>
      <text x="360" y="677">Przysiad</text>
      <text x="680" y="677">75 kg × 5</text>
    </g>

    <g stroke="#14181D" stroke-opacity="0.08" stroke-width="2">
      <line x1="140" y1="382" x2="1132" y2="382"/>
      <line x1="140" y1="460" x2="1132" y2="460"/>
      <line x1="140" y1="538" x2="1132" y2="538"/>
      <line x1="140" y1="616" x2="1132" y2="616"/>
    </g>

    <!-- kolumna zmiany -->
    <text x="1000" y="365" font-size="28" fill="#6B7280" text-anchor="middle">punkt startu</text>

    <g font-size="26" font-weight="700" fill="#14181D" text-anchor="middle">
      <rect x="930" y="414" width="140" height="40" fill="#D2F34C"/>
      <text x="1000" y="442">+5 kg</text>

      <rect x="930" y="492" width="140" height="40" fill="#D2F34C"/>
      <text x="1000" y="520">+5 kg</text>

      <rect x="930" y="570" width="140" height="40" fill="#D2F34C"/>
      <text x="1000" y="598">+1 powt.</text>

      <rect x="930" y="648" width="140" height="40" fill="#D2F34C"/>
      <text x="1000" y="676">+5 kg</text>
    </g>

    <!-- notatka po sesji -->
    <line x1="140" y1="706" x2="1132" y2="706" stroke="#14181D" stroke-opacity="0.18" stroke-width="2"/>
    <rect x="180" y="738" width="22" height="22" fill="#D2F34C"/>
    <text x="216" y="757" font-size="28" fill="#14181D">Do poprawy: kolano ucieka w ósmym powtórzeniu</text>
    <text x="180" y="800" font-size="25" fill="#6B7280">Karta zostaje u Ciebie po każdej sesji</text>

    <text x="140" y="900" font-size="27" fill="#6B7280">Tak samo dla martwego ciągu i wyciskania</text>
  </g>
</svg>
